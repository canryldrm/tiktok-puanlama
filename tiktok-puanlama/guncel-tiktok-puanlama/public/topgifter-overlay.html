<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>En Çok Jeton Atan Kral Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="topgifter-overlay.css">
</head>
<body>
    <div id="topgifter-section" class="hidden">
        <div class="gifter-card">
            <div class="crown-icon">👑</div>
            <div class="title">YAYININ KRALI</div>
            <img id="gifter-avatar" src="" alt="Avatar">
            <div id="gifter-username" class="username">Kullanıcı Adı</div>
            <div class="coins-container">
                <span id="gifter-coins" class="coins-text">0</span>
            </div>
            <img id="gifter-best-gift" class="best-gift-img" src="" alt="Hediye" style="display: none;">
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="topgifter-overlay.js"></script>
</body>
</html>
