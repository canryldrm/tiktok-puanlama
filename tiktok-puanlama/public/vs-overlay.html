<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>VS Overlay</title>
  <style>
    body { font-family: 'Poppins', sans-serif; margin: 0; overflow: hidden; background: transparent; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    .vs-container { width: 100%; position: absolute; top: 20px; left: 0; padding: 0 50px; box-sizing: border-box; }
    .title-row { text-align:center; font-size: 46px; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; display: flex; justify-content: center; gap: 30px; align-items: center; }
    .title-green { color: #10b981; text-shadow: 0 0 10px #10b981; }
    .title-red { color: #f87171; text-shadow: 0 0 10px #f87171; }
    .title-vs { color: #ffd700; font-size: 70px; font-style: italic; }
    
    .bar-container { display: flex; width: 100%; height: 90px; border-radius: 45px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.6); border: 6px solid rgba(255,255,255,0.8); }
    .green-bar { background: linear-gradient(90deg, #059669, #10b981); display: flex; align-items: center; padding-left: 25px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); font-size: 55px; font-weight: 900;}
    .red-bar { background: linear-gradient(90deg, #f87171, #dc2626); display: flex; align-items: center; justify-content: flex-end; padding-right: 25px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); font-size: 55px; font-weight: 900;}
    
    .players { display: flex; justify-content: space-between; margin-top: 20px; padding: 0 30px; }
    .team { display: flex; align-items: center; gap: 30px; background: rgba(0,0,0,0.5); padding: 15px 40px; border-radius: 60px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); }
    .team img { width: 140px; height: 140px; border-radius: 50%; border: 8px solid white; object-fit: cover; }
    .team-title { font-size: 28px; font-weight: 600; color: #cbd5e1; }
    .player-name { font-size: 45px; font-weight: 900; color: white; }
  </style>
</head>
<body>
   <div class="vs-container">
      <div class="title-row">
         <span class="title-green">(+) ARTICILAR</span> 
         <span class="title-vs">VS</span> 
         <span class="title-red">EKSİCİLER (-)</span>
      </div>
      <div class="bar-container">
         <div class="green-bar" id="green-bar" style="width: 50%;">0</div>
         <div class="red-bar" id="red-bar" style="width: 50%;">0</div>
      </div>
      <div class="players">
         <div class="team">
            <img id="green-pic" src="https://picsum.photos/100" style="border-color: #10b981;">
            <div class="team-title">Son Artı Atan:<br><span class="player-name" id="green-name">Bekleniyor...</span></div>
         </div>
         <div class="team" style="flex-direction: row-reverse;">
            <img id="red-pic" src="https://picsum.photos/101" style="border-color: #f87171;">
            <div class="team-title" style="text-align: right;">Son Eksi Atan:<br><span class="player-name" id="red-name">Bekleniyor...</span></div>
         </div>
      </div>
   </div>

   <script src="/socket.io/socket.io.js"></script>
   <script>
     const urlParams = new URLSearchParams(window.location.search);
     const roomId = urlParams.get('room');
     const socket = io();
     socket.emit('joinRoom', roomId);

     socket.on('vsUpdate', (data) => {
        const total = data.green + data.red;
        const greenPct = total === 0 ? 50 : (data.green / total) * 100;
        const redPct = total === 0 ? 50 : (data.red / total) * 100;

        document.getElementById('green-bar').style.width = greenPct + '%';
        document.getElementById('red-bar').style.width = redPct + '%';
        document.getElementById('green-bar').innerText = data.green;
        document.getElementById('red-bar').innerText = data.red;

        if (data.greenLast) {
           document.getElementById('green-pic').src = data.greenLast.profilePic;
           document.getElementById('green-name').innerText = data.greenLast.username;
        }
        if (data.redLast) {
           document.getElementById('red-pic').src = data.redLast.profilePic;
           document.getElementById('red-name').innerText = data.redLast.username;
        }
     });
   </script>
</body>
</html>
