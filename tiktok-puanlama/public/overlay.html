<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rating Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="overlay.css">
</head>
<body>
    <div id="overlay">
        <!-- MERKEZ: Devasa Puan ve Durum -->
        <div id="center-content">
            <div id="current-person" class="hidden"></div>
            <div id="score-display">--</div>
            
            <div id="voting-status">
                <span class="status-dot"></span>
                <span class="status-text">Oylama kapalı</span>
            </div>
            
            <div id="countdown-container" class="hidden">
                <div id="countdown"></div>
            </div>
        </div>
        
        <!-- ALT: Sağdan Sola Kayan Oy Verenler -->
        <div id="votes-list"></div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="overlay.js?v=2"></script>
</body>
</html>
