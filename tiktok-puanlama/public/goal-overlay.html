<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Günlük Hedef</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent !important; overflow: hidden; font-family: 'Poppins', sans-serif; padding: 20px; }
        .goal-container { width: 400px; text-align: center; }
        .goal-title { color: white; font-family: 'Russo One', sans-serif; font-size: 24px; text-shadow: 2px 2px 4px #000; margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
        .progress-wrapper { width: 100%; height: 35px; background: rgba(0,0,0,0.6); border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); overflow: hidden; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .progress-fill { height: 100%; background: var(--theme-color, #FFD700); width: 0%; transition: width 0.5s ease-out; position: relative; overflow: hidden; }
        .progress-fill::after { content: ''; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%); animation: shimmer 2s infinite; }
        .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: 900; font-size: 18px; text-shadow: 1px 1px 3px black, -1px -1px 3px black; z-index: 2; width: 100%; }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
</head>
<body>
    <div class="goal-container">
        <div id="goal-title-el" class="goal-title">MOTOR İÇİN HEDEF</div>
        <div class="progress-wrapper">
            <div id="progress-fill" class="progress-fill"></div>
            <div id="progress-text" class="progress-text">0 / 50000</div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const currentRoomId = urlParams.get('room');
        if (currentRoomId) socket.on('connect', () => socket.emit('joinRoom', currentRoomId));
        
        socket.on('state:update', (data) => {
            if (data.themeColor) document.documentElement.style.setProperty('--theme-color', data.themeColor);
            if (data.goal) {
                document.getElementById('goal-title-el').textContent = data.goal.title || 'HEDEF';
                let cur = data.goal.current || 0;
                let tgt = data.goal.target || 1;
                document.getElementById('progress-text').textContent = cur + ' / ' + tgt;
                let pct = (cur / tgt) * 100;
                if (pct > 100) pct = 100;
                document.getElementById('progress-fill').style.width = pct + '%';
            }
        });
    </script>
</body>
</html>
