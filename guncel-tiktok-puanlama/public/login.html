<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selibon Medya Overlay - Giris</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1a2e;
      font-family: "Poppins", sans-serif;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("background.png");
      background-repeat: repeat;
      background-size: 150px;
      opacity: 0.15;
      z-index: 0;
      pointer-events: none;
    }
    .login-box {
      position: relative;
      z-index: 1;
      background: rgba(15,23,42,0.92);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 20px;
      padding: 48px 40px;
      width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    .login-logo { height: 70px; object-fit: contain; margin-bottom: 16px; }
    h1 {
      font-size: 1.6rem; font-weight: 700; margin-bottom: 4px;
      background: linear-gradient(135deg,#00d4ff,#ffffff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { color: rgba(255,255,255,0.4); font-size: 0.85rem; margin-bottom: 36px; }
    .input-wrap { position: relative; margin-bottom: 16px; }
    .input-wrap input {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #fff;
      padding: 14px 18px 14px 48px;
      font-family: "Poppins",sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .input-wrap input:focus {
      border-color: rgba(0,212,255,0.6);
      box-shadow: 0 0 12px rgba(0,212,255,0.2);
    }
    .input-wrap .icon {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%); font-size: 18px; opacity: 0.5;
    }
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg,#00d4ff,#007bff);
      border: none; border-radius: 10px; color: #fff;
      padding: 14px;
      font-family: "Poppins",sans-serif; font-weight: 700; font-size: 15px;
      cursor: pointer; margin-top: 8px;
      text-transform: uppercase; letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,212,255,0.35);
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,212,255,0.5); }
    .btn-login:active { transform: scale(0.97); }
    .error-msg {
      background: rgba(255,65,108,0.15);
      border: 1px solid rgba(255,65,108,0.4);
      border-radius: 8px; color: #ff6b9d;
      padding: 10px 14px; font-size: 0.82rem;
      margin-top: 14px; display: none;
    }
    .footer-text { margin-top: 24px; color: rgba(255,255,255,0.25); font-size: 0.72rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <img src="logo.png" alt="Logo" class="login-logo">
    <h1>Selibon Medya</h1>
    <p class="subtitle">Overlay Kontrol Paneli</p>
    <div class="input-wrap">
      <span class="icon">&#128100;</span>
      <input type="text" id="username" placeholder="Kullanici Adi">
    </div>
    <div class="input-wrap">
      <span class="icon">&#128274;</span>
      <input type="password" id="password" placeholder="Sifre" onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()">&#128272; Giris Yap</button>
    <div class="error-msg" id="error-msg">Kullanici adi veya sifre hatali!</div>
    <p class="footer-text">Selibon Medya Overlay 2024</p>
  </div>
  <script>
    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("error-msg");
      errEl.style.display = "none";
      if (!username || !password) {
        errEl.textContent = "Kullanici adi ve sifre bos birakilamaz!";
        errEl.style.display = "block"; return;
      }
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) { window.location.href = "/panel.html"; }
        else {
          errEl.textContent = data.error || "Giris basarisiz!";
          errEl.style.display = "block";
        }
      } catch(e) {
        errEl.textContent = "Sunucuya baglanilmadi!";
        errEl.style.display = "block";
      }
    }
  </script>
</body>
</html>
